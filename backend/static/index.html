<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PM MVP - Hello World</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        color: #032147;
      }
      h1 {
        margin-bottom: 0.5rem;
      }
      #result {
        margin-top: 1rem;
        color: #753991;
      }
      button {
        border: 0;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        cursor: pointer;
        background: #209dd7;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <h1>Hello from the PM MVP scaffold</h1>
    <p>This static page is served by FastAPI from inside Docker.</p>
    <button id="check-health">Call /api/health</button>
    <pre id="result"></pre>

    <script>
      const resultEl = document.getElementById("result");
      const button = document.getElementById("check-health");

      button.addEventListener("click", async () => {
        resultEl.textContent = "Loading...";
        try {
          const response = await fetch("/api/health");
          const json = await response.json();
          resultEl.textContent = JSON.stringify(json, null, 2);
        } catch (error) {
          resultEl.textContent = `Request failed: ${error}`;
        }
      });
    </script>
  </body>
</html>
